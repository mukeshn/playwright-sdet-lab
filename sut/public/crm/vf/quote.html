<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Quote Calculator</title>
<style>body{font-family:Arial,sans-serif;font-size:13px;margin:8px} .pbBody td{padding:4px} input{width:120px} .pbButton{margin-top:8px}</style></head>
<body>
<form id="j_id0:quoteForm">
  <div class="pbBody"><table>
    <tr><td><label for="j_id0:quoteForm:listPrice">List price (EUR)</label></td><td><input id="j_id0:quoteForm:listPrice" name="listPrice" type="number" step="0.01"></td></tr>
    <tr><td><label for="j_id0:quoteForm:quantity">Quantity</label></td><td><input id="j_id0:quoteForm:quantity" name="quantity" type="number" value="1"></td></tr>
    <tr><td><label for="j_id0:quoteForm:discount">Discount (%)</label></td><td><input id="j_id0:quoteForm:discount" name="discount" type="number" value="0"></td></tr>
  </table></div>
  <div class="pbButton"><input type="button" class="btn" id="j_id0:quoteForm:calc" value="Calculate"></div>
  <p class="messageText" id="j_id0:quoteForm:msg" role="alert"></p>
  <p>Net total: <strong id="j_id0:quoteForm:netTotal"></strong></p>
</form>
<script>
  const q = (id) => document.getElementById('j_id0:quoteForm:' + id);
  q('listPrice').value = new URLSearchParams(location.search).get('amount') || '';
  q('calc').addEventListener('click', () => {
    const price = Number(q('listPrice').value), qty = Number(q('quantity').value), disc = Number(q('discount').value);
    q('msg').textContent = '';
    if (disc > 30) { q('msg').textContent = 'Error: Discounts above 30% require approval.'; q('netTotal').textContent = ''; return; }
    if (!(qty >= 1)) { q('msg').textContent = 'Error: Quantity must be at least 1.'; return; }
    q('netTotal').textContent = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(price * qty * (1 - disc / 100));
  });
</script>
</body>
</html>
